<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" role="img" aria-label="Anatomy of one decision, from a slot in the spec to a rendered component and an impression">
 <defs><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b95a3"/></marker></defs>
 <rect width="960" height="450" fill="#fff"/>

 <rect x="32" y="48" width="200" height="90" rx="11" fill="#f8fafc" stroke="#d7dce3"/>
 <text x="48" y="74" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">1 SLOT</text>
 <text x="48" y="99" font-size="13.5" fill="#14161a" font-family="ui-monospace,Menlo,monospace">variant(Hero, ...)</text>
 <text x="48" y="120" font-size="12.5" fill="#5b6472">two options, one default</text>

 <rect x="286" y="48" width="242" height="90" rx="11" fill="#f8fafc" stroke="#d7dce3"/>
 <text x="302" y="74" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">2 QUESTION</text>
 <text x="302" y="99" font-size="13.5" fill="#14161a">type: choice, with your</text>
 <text x="302" y="119" font-size="13.5" fill="#14161a">criteria sent verbatim</text>

 <rect x="582" y="48" width="236" height="152" rx="11" fill="#f8fafc" stroke="#d7dce3"/>
 <text x="598" y="74" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">3 ANSWER</text>
 <text x="598" y="99" font-size="13" fill="#5b6472">specTable</text>
 <rect x="598" y="106" width="176" height="8" rx="4" fill="#dbe4f0"/><rect x="598" y="106" width="155" height="8" rx="4" fill="#2563eb"/>
 <text x="782" y="114" font-size="12" fill="#5b6472">.88</text>
 <text x="598" y="138" font-size="13" fill="#5b6472">bigImage</text>
 <rect x="598" y="145" width="176" height="8" rx="4" fill="#dbe4f0"/><rect x="598" y="145" width="21" height="8" rx="4" fill="#94b0e8"/>
 <text x="782" y="153" font-size="12" fill="#5b6472">.12</text>
 <text x="598" y="180" font-size="12.5" fill="#14161a">confidence 0.81</text>

 <rect x="300" y="228" width="420" height="86" rx="11" fill="#f6f9ff" stroke="#c7d7ff"/>
 <text x="318" y="254" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">4 GATE</text>
 <text x="318" y="278" font-size="13.5" fill="#14161a">0.81 clears the floor, so the model's answer is used.</text>
 <text x="318" y="299" font-size="13" fill="#5b6472">Below it the declared default renders instead, and the row is marked gated.</text>

 <rect x="32" y="228" width="200" height="86" rx="11" fill="#f8fafc" stroke="#d7dce3"/>
 <text x="48" y="254" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">5 RENDER</text>
 <text x="48" y="279" font-size="13.5" fill="#14161a" font-family="ui-monospace,Menlo,monospace">&lt;Hero variant=</text>
 <text x="48" y="299" font-size="13.5" fill="#14161a" font-family="ui-monospace,Menlo,monospace">"specTable" /&gt;</text>

 <rect x="32" y="352" width="420" height="66" rx="11" fill="#f8fafc" stroke="#d7dce3"/>
 <text x="48" y="378" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">6 IMPRESSION</text>
 <text x="48" y="401" font-size="13" fill="#14161a" font-family="ui-monospace,Menlo,monospace">{ decisionId, slot, variant, confidence, gated }</text>

 <g stroke="#8b95a3" stroke-width="1.8" fill="none" marker-end="url(#n)">
  <path d="M232 93 H280"/>
  <path d="M528 93 H576"/>
  <path d="M700 200 V222"/>
  <path d="M300 271 H238"/>
  <path d="M132 314 V346"/>
 </g>
</svg>
