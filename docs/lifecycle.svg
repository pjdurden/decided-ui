<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" role="img" aria-label="Request lifecycle across browser, your server, Jev and analytics">
 <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c8780"/></marker></defs>
 <rect width="960" height="470" fill="#faf7f2"/>
 <g font-size="12.5" font-weight="700" fill="#c43a12" letter-spacing=".9">
  <text x="24" y="28">BROWSER</text><text x="270" y="28">YOUR SERVER</text><text x="600" y="28">JEV</text><text x="810" y="28">ANALYTICS</text>
 </g>
 <g stroke="#ddd7d0" stroke-width="1.5"><path d="M70 42 V430"/><path d="M340 42 V430"/><path d="M628 42 V430"/><path d="M866 42 V430"/></g>

 <g stroke="#8c8780" stroke-width="1.8" fill="none" marker-end="url(#m)">
  <path d="M70 80 H330"/><path d="M340 150 H618"/><path d="M628 218 H350"/><path d="M340 330 H80"/><path d="M70 392 H856"/>
 </g>
 <g font-size="13.5" fill="#121110">
  <text x="86" y="74">request, with whatever you know about the user</text>
  <text x="352" y="144">one POST: every slot compiled into a question</text>
  <text x="362" y="212">typed answers, each with a probability distribution</text>
  <text x="92" y="324">HTML or props: the chosen variants, plus a decisionId</text>
  <text x="86" y="386">impression per slot on mount, conversions later</text>
 </g>
 <g font-size="12" fill="#6a6660">
  <text x="352" y="163">questions are answered in parallel, so twelve costs about what one costs</text>
  <text x="362" y="231">the key never leaves this box</text>
  <text x="92" y="343">nothing was generated; every variant is one you wrote</text>
 </g>
 <g font-size="12" fill="#c43a12" font-weight="640">
  <text x="352" y="196">~0.5 s measured</text>
  <text x="352" y="288">assemble + render: hundredths of a millisecond</text>
 </g>
 <rect x="344" y="248" width="270" height="30" rx="8" fill="#ffeae3" stroke="#ffc7b6"/>
 <text x="358" y="268" font-size="13" fill="#121110">assembler applies your policy, no I/O</text>
 <text x="24" y="452" font-size="12.5" fill="#6a6660">A cached visitor skips the middle entirely and costs nothing.</text>
</svg>
